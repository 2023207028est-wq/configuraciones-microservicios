server:
  port: 8082

spring:
  datasource:
    driver-class-name: org.mariadb.jdbc.Driver
    url: ${PRODUCTO_DB_URL}
    username: ${PRODUCTO_DB_USERNAME}
    password: ${PRODUCTO_DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    hostname: localhost
